server:
  port: 8080

spring:
  application:
    name: gateway-server
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-admin-route
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**

        - id: event-admin-route
          uri: lb://event-service
          predicates:
            - Path=/admin/events/**, /admin/categories/**, /admin/compilations/**

        - id: event-public-route
          uri: lb://event-service
          predicates:
            - Path=/events/**, /categories/**, /compilations/**

        - id: user-events-route
          uri: lb://event-service
          predicates:
            - Path=/users/*/events/**

        - id: user-requests-route
          uri: lb://request-service
          predicates:
            - Path=/users/*/requests/**

        - id: stats-route
          uri: lb://stats-server
          predicates:
            - Path=/hit, /stats
    loadbalancer:
      cache:
        ttl: 5s

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiry-duration-in-seconds: 15

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info,env
