server:
  port: 8080

spring:
  application:
    name: gateway-server
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: main-service
          uri: lb://main-service
          predicates:
            - Path=/admin/**, /users/**, /events/**, /categories/**, /compilations/**
        - id: stats-server
          uri: lb://stats-server
          predicates:
            - Path=/hit, /stats
    loadbalancer:
      cache:
        ttl: 5s

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiry-duration-in-seconds: 15

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info,env
